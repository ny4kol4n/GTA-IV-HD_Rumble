; GTA-IV-HD_Rumble 1.0. Restart GTA IV after editing.
; Decimal separator: dot. Invalid values use defaults; out-of-range values are clamped.
[GTA-IV-HD_Rumble]
; 0=Strong, 1=Medium, 2=Light. P changes profile for the current session.
Profile=1
ControllerIndex=0
SaveHashes=1
; Overall vehicle effect gain: 0..400 percent. Does not scale shooting.
MainStrengthPercent=100
; Per-motor ceiling after gains: 0..65535.
MotorLimit=1500
; Base burst-tyre strength before gains and ceiling: 0..65535.
TyreStrength=300

; Per-effect gain: 0=disabled, 100=current strength, 200=double; range 0..400.
[Effects]
Acceleration=100
Braking=100
Gear=100
Bumps=100
Turns=100
Damage=100
Tyres=100

; StrengthPercent: 0..400. Thresholds: speed change in m/s per 70 ms,
; positive numbers, 0.001..10. Smaller values trigger more easily.
; TyreMinSpeedKmh: 0..360; tyre effect requires speed ABOVE this value.
[Strong]
StrengthPercent=100
AccelerationThreshold=0.06
BrakingThreshold=0.06
TyreMinSpeedKmh=7.2
[Medium]
StrengthPercent=100
AccelerationThreshold=0.08
BrakingThreshold=0.08
TyreMinSpeedKmh=18
[Light]
StrengthPercent=100
AccelerationThreshold=0.10
BrakingThreshold=0.10
TyreMinSpeedKmh=36

; Main motors only. 100=stock command, 150=1.5x, 0=mute during detection window.
; Range 0..400; coincident non-shooting effects may also be scaled.
[Shooting]
OnFootPercent=150
InVehiclePercent=150

; Requires Linux bridge. Toggles: 0=off, 1=on.
[Triggers]
Enabled=1
Acceleration=1
Braking=1
ShootingOnFoot=1
; Off by default: in-car firing uses LB, not RT.
ShootingInVehicle=0
; Maximum trigger intensity: 0..12 percent of full hardware scale.
StrengthPercent=5
; Effect gains: 0..400. Still limited by StrengthPercent.
DrivingPercent=100
ShootingPercent=100
